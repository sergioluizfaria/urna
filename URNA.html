<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Urna Eletrônica Brasil - Eleições 2026</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Arial', 'Helvetica', sans-serif;
      font-weight: bold;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .urna-container {
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      background: #d4d4d4;
      border: 4px solid #555;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 0 30px rgba(0,0,0,0.9);
      position: relative;
    }

    .topo-urna {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #888;
      padding-bottom: 6px;
      margin-bottom: 6px;
      gap: 10px;
    }

    .topo-urna h2 {
      margin: 0;
      font-size: 19px;
      color: #111;
      text-transform: uppercase;
      letter-spacing: 1px;
      flex: 1;
      text-align: left;
    }

    .topo-admin-btn {
      font-size: 24px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: transform 0.1s;
    }
    .topo-admin-btn:active {
      transform: scale(0.9);
    }

    .tela-lcd {
      background-color: #8cb88b;
      border: 3px solid #486148;
      border-radius: 8px;
      flex: 1;
      min-height: 290px;
      padding: 12px 14px;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.4);
      color: #041c04;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .lcd-header {
      font-size: 13px;
      text-transform: uppercase;
      border-bottom: 2px solid #486148;
      padding-bottom: 4px;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lcd-body {
      display: flex;
      flex: 1;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .lcd-info-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: flex-start;
    }

    .cargo-titulo {
      font-size: 21px;
      text-transform: uppercase;
      color: #000;
      letter-spacing: 1px;
    }

    .caixas-numero {
      display: flex;
      gap: 8px;
      margin: 8px 0;
    }

    .digito-box {
      width: 44px;
      height: 54px;
      border: 3px solid #041c04;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      background: rgba(255,255,255,0.25);
    }

    .digito-box.pisca {
      animation: piscar 0.8s infinite;
    }

    @keyframes piscar {
      0%, 100% { border-color: #041c04; background: rgba(255,255,255,0.4); }
      50% { border-color: transparent; background: transparent; }
    }

    .lcd-foto-container {
      position: absolute;
      right: 0;
      top: 0;
      width: 140px;
      height: 185px;
      border: 2px solid #041c04;
      background: #a2c8a2;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #222;
      padding: 2px;
    }

    .lcd-foto-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .dado-candidato {
      position: absolute;
      left: 0;
      bottom: 8px;
      width: 100%;
      font-size: 19px;
      line-height: 1.4;
      word-break: break-word;
    }

    .lcd-instrucoes {
      border-top: 2px solid #486148;
      padding-top: 6px;
      font-size: 14px;
      text-transform: uppercase;
      line-height: 1.35;
    }

    .tela-concluido {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      color: #000;
      animation: fadeIn 0.4s ease-in-out;
    }

    .tela-concluido .msg-principal {
      font-size: 38px;
      letter-spacing: 2px;
      color: #004d00;
      margin-bottom: 8px;
    }

    .tela-concluido .sub-msg {
      font-size: 17px;
      color: #222;
      font-weight: normal;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .tela-espera { 
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100%;
      text-align: center;
      cursor: pointer;
      padding: 2px;
    }

    .painel-parcial {
      width: 100%;
      background: rgba(4, 28, 4, 0.15);
      border: 2px solid #486148;
      border-radius: 6px;
      padding: 8px;
      max-height: 110px;
      overflow-y: auto;
      text-align: left;
      font-size: 12px;
    }

    .parcial-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #486148;
      padding: 3px 0;
    }

    .total-votos-div {
      font-size: 14px;
      color: #041c04;
      margin: 2px 0;
      font-weight: bold;
    }

    .texto-votar {
      font-size: 42px;
      color: #006600;
      letter-spacing: 3px;
      text-shadow: 1px 1px 0px rgba(255,255,255,0.6);
      margin: 2px 0;
    }

    .aviso-clique-tela {
      font-size: 20px;
      color: #004d00;
      font-weight: bold;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .teclado {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .teclado-numerico {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .btn-num {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 12px 0;
      font-size: 22px;
      box-shadow: 0 3px 0 #000;
      cursor: pointer;
      text-align: center;
    }

    .btn-num:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #000;
    }

    .teclado-linha-zero {
      display: flex;
      justify-content: center;
    }
    .teclado-linha-zero .btn-num {
      width: 32%;
    }

    .teclado-acoes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 2px;
    }

    .btn-acao {
      border: none;
      border-radius: 6px;
      padding: 14px 2px;
      font-size: 13px;
      text-transform: uppercase;
      box-shadow: 0 3px 0 rgba(0,0,0,0.6);
      cursor: pointer;
      color: #000;
    }

    .btn-acao:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.6);
    }

    .btn-branco { background-color: #ffffff; }
    .btn-correge { background-color: #ff5500; color: #fff; }
    .btn-confirma { background-color: #00aa00; color: #fff; font-size: 14px; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-card {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-radius: 10px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      color: #222;
    }

    .modal-card h3 {
      margin-top: 0;
      font-size: 18px;
      border-bottom: 2px solid #ddd;
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 14px;
      color: #333;
    }

    .input-uppercase {
      text-transform: uppercase;
    }

    .form-group input, .form-group select {
      padding: 10px;
      border: 2px solid #bbb;
      border-radius: 6px;
      font-size: 15px;
    }

    .btn-modal {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
      margin-top: 6px;
      font-weight: bold;
    }

    .btn-fechar { background: #6c757d; }

    .papel-termico {
      background: #fffef0;
      border: 1px dashed #777;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace !important;
      font-size: 12px;
      font-weight: normal !important;
      color: #000;
      box-shadow: 0 0 8px rgba(0,0,0,0.2);
      margin-top: 12px;
      white-space: pre-wrap;
      line-height: 1.3;
    }
    .papel-termico * { font-family: 'Courier New', Courier, monospace !important; font-weight: normal !important; }
    
    .lista-admin {
      font-size: 13px;
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }
    .lista-admin th, .lista-admin td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="urna-container">
    <div class="topo-urna">
      <h2>JUSTIÇA ELEITORAL</h2>
      <button class="topo-admin-btn" onclick="abrirLoginAdmin()" title="Painel Administrativo">BRASIL</button>
    </div>

    <div class="tela-lcd" id="telaLCD"></div>

    <div class="teclado">
      <div class="teclado-numerico">
        <button class="btn-num" onclick="digitar('1')">1</button>
        <button class="btn-num" onclick="digitar('2')">2</button>
        <button class="btn-num" onclick="digitar('3')">3</button>
        <button class="btn-num" onclick="digitar('4')">4</button>
        <button class="btn-num" onclick="digitar('5')">5</button>
        <button class="btn-num" onclick="digitar('6')">6</button>
        <button class="btn-num" onclick="digitar('7')">7</button>
        <button class="btn-num" onclick="digitar('8')">8</button>
        <button class="btn-num" onclick="digitar('9')">9</button>
      </div>
      <div class="teclado-linha-zero">
        <button class="btn-num" onclick="digitar('0')">0</button>
      </div>

      <div class="teclado-acoes">
        <button class="btn-action btn-branco btn-acao" onclick="votarBranco()">BRANCO</button>
        <button class="btn-action btn-correge btn-acao" onclick="corrigir()">CORRIGE</button>
        <button class="btn-action btn-confirma btn-acao" onclick="confirmar()">CONFIRMA</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalLogin">
    <div class="modal-card">
      <h3>Acesso Restrito - Admin</h3>
      <div class="form-group">
        <label>Senha de Acesso:</label>
        <input type="password" id="senhaAdmin" placeholder="Digite a senha" onkeydown="if(event.key==='Enter') autenticarAdmin()">
      </div>
      <button class="btn-modal" onclick="autenticarAdmin()">Entrar</button>
      <button class="btn-modal btn-fechar" onclick="fecharModal('modalLogin')">Cancelar</button>
    </div>
  </div>

  <div class="modal-overlay" id="modalPainel">
    <div class="modal-card">
      <h3>Painel do Administrador</h3>
      
      <div style="display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;">
        <button class="btn-modal" style="background:#28a745; flex:1;" onclick="mostrarAba('abaCad')">Candidatos</button>
        <button class="btn-modal" style="background:#ffc107; color:#000; flex:1;" onclick="mostrarAba('abaRel')">Relatórios</button>
        <button class="btn-modal" style="background:#6c757d; flex:1;" onclick="mostrarAba('abaSom')">Som</button>
      </div>

      <div id="abaCad">
        <h4>Novo Candidato</h4>
        <div class="form-group">
          <label>Nome do Candidato:</label>
          <input type="text" id="cadNome" class="input-uppercase" placeholder="EX: JOÃO SILVA" onkeydown="navegarEnter(event, 'cadNumero')">
        </div>
        <div class="form-group">
          <label>Número do Candidato:</label>
          <input type="number" id="cadNumero" placeholder="EX: 13, 22" onkeydown="navegarEnter(event, 'cadPartido')">
        </div>
        <div class="form-group">
          <label>Sigla do Partido:</label>
          <input type="text" id="cadPartido" class="input-uppercase" placeholder="EX: PT, PL" onkeydown="navegarEnter(event, 'cadFotoUrl')">
        </div>
        <div class="form-group">
          <label>URL da Imagem:</label>
          <input type="text" id="cadFotoUrl" placeholder="Cole o link da imagem" onkeydown="if(event.key==='Enter') salvarCandidato()">
        </div>
        <button class="btn-modal" id="btnSalvarCand" onclick="salvarCandidato()">Salvar Candidato</button>

        <h4 style="margin-top: 18px;">Candidatos Cadastrados</h4>
        <div style="overflow-x:auto;">
          <table class="lista-admin" id="tabelaCandidatos"></table>
        </div>
      </div>

      <div id="abaRel" style="display:none;">
        <button class="btn-modal" style="background:#ffc107; color:#000;" onclick="imprimirZeresima()">Imprimir Zerésima</button>
        <button class="btn-modal" style="background:#6f42c1" onclick="imprimirBoletimUrna()">Imprimir Boletim de Urna (BU)</button>
        <button class="btn-modal" style="background:#dc3545" onclick="zerarVotos()">Zerar Votação</button>
        <div id="areaImpressao" class="papel-termico" style="display:none;"></div>
      </div>

      <div id="abaSom" style="display:none;">
        <h4>Som de Confirmação do Voto</h4>
        <div class="form-group">
          <label>Selecione o arquivo de áudio (MP3):</label>
          <input type="file" id="audioFileInput" accept="audio/*" onchange="carregarAudioLocal(this)">
        </div>
        <button class="btn-modal" style="background:#28a745;" onclick="testarAudio()">Testar Som Atual</button>
        <button class="btn-modal" style="background:#dc3545;" onclick="removerAudioCustomizado()">Restaurar Som Padrão</button>
        <div id="statusAudio" style="margin-top:10px; font-size:12px; color:#333;"></div>
      </div>

      <button class="btn-modal btn-fechar" style="margin-top:15px;" onclick="fecharModal('modalPainel')">Sair do Painel</button>
    </div>
  </div>

  <div class="modal-overlay" id="modalEditar">
    <div class="modal-card">
      <h3>Editar Candidato</h3>
      <input type="hidden" id="editIndex">
      <div class="form-group">
        <label>Nome do Candidato:</label>
        <input type="text" id="editNome" class="input-uppercase" onkeydown="navegarEnter(event, 'editNumero')">
      </div>
      <div class="form-group">
        <label>Número:</label>
        <input type="number" id="editNumero" onkeydown="navegarEnter(event, 'editPartido')">
      </div>
      <div class="form-group">
        <label>Sigla do Partido:</label>
        <input type="text" id="editPartido" class="input-uppercase" onkeydown="navegarEnter(event, 'editFotoUrl')">
      </div>
      <div class="form-group">
        <label>URL da Imagem:</label>
        <input type="text" id="editFotoUrl" placeholder="Cole a URL da foto" onkeydown="if(event.key==='Enter') salvarEdicaoCandidato()">
      </div>
      <button class="btn-modal" style="background:#28a745" onclick="salvarEdicaoCandidato()">Salvar Alterações</button>
      <button class="btn-modal btn-fechar" onclick="fecharModal('modalEditar')">Cancelar</button>
    </div>
  </div>

  <script>
    const listaInicialDireta = [
      { numero: '13', nome: 'LULA TRIPLEX', partido: 'PT', foto: 'https://s2.glbimg.com/dUw4F8UhzFEfPbfv_cPxgFEdsI4=/s.glbimg.com/jo/g1/f/original/2016/03/03/lulanoapt-a1.jpg' },
      { numero: '22', nome: 'FLÁVIO RACHADINHA', partido: 'PL', foto: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT9cP-mib203BaFvyKY9I3IHppGLZO7aCJtSxz2JKvRRujn5X1kk6bisX2H&s=10' }
    ];

    const ETAPAS = [
      { titulo: 'PRESIDENTE', digitos: 2 }
    ];

    let candidatos = [];
    let votos = [];
    let etapaAtual = 0;
    let numeroDigitado = '';
    let votoBranco = false;
    let votacaoIniciada = false; 
    let telaFimExibida = false;

    if (localStorage.getItem('urna_v6_candidatos')) {
      candidatos = JSON.parse(localStorage.getItem('urna_v6_candidatos'));
    } else {
      candidatos = listaInicialDireta;
      localStorage.setItem('urna_v6_candidatos', JSON.stringify(candidatos));
    }

    if (localStorage.getItem('urna_v6_votos')) votos = JSON.parse(localStorage.getItem('urna_v6_votos'));

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let customAudioBase64 = localStorage.getItem('urna_audio_confirma') || null;

    function tocarBeep(freq = 1300, duracao = 0.05) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duracao);
    }

    function tocarSomFimUrna() {
      if (customAudioBase64) {
        try { new Audio(customAudioBase64).play(); return; } catch(e) {}
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.type = 'sine'; osc2.type = 'sine';
      osc1.frequency.setValueAtTime(520, t); osc1.frequency.setValueAtTime(780, t + 0.15);
      osc2.frequency.setValueAtTime(660, t); osc2.frequency.setValueAtTime(980, t + 0.15);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.linearRampToValueAtTime(0.2, t + 1.1);
      gain.gain.linearRampToValueAtTime(0, t + 1.25);
      osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
      osc1.start(t); osc2.start(t); osc1.stop(t + 1.25); osc2.stop(t + 1.25);
    }

    function carregarAudioLocal(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          customAudioBase64 = e.target.result;
          try {
            localStorage.setItem('urna_audio_confirma', customAudioBase64);
            document.getElementById('statusAudio').innerText = `Áudio carregado com sucesso!`;
          } catch(err) { alert('Arquivo muito grande para o LocalStorage!'); }
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function testarAudio() { tocarSomFimUrna(); }
    function removerAudioCustomizado() {
      customAudioBase64 = null;
      localStorage.removeItem('urna_audio_confirma');
      document.getElementById('statusAudio').innerText = 'Som restaurado para o padrão.';
    }

    function atualizarTela() {
      const lcd = document.getElementById('telaLCD');

      if (telaFimExibida) {
        lcd.innerHTML = `
          <div class="tela-concluido">
            <div class="msg-principal">VOTO CONCLUÍDO</div>
            <div class="sub-msg">Aguardando próximo eleitor...</div>
          </div>
        `;
        return;
      }

      if (!votacaoIniciada) {
        let totalVotos = votos.length;
        let contagemCand = {};
        let brancos = 0;
        let nulos = 0;

        candidatos.forEach(c => contagemCand[c.numero] = 0);
        votos.forEach(v => {
          if (v.tipo === 'VALIDO') contagemCand[v.numero] = (contagemCand[v.numero] || 0) + 1;
          else if (v.tipo === 'BRANCO') brancos++;
          else if (v.tipo === 'NULO') nulos++;
        });

        let htmlParciais = '';
        candidatos.forEach(c => {
          let qtd = contagemCand[c.numero] || 0;
          let pct = totalVotos > 0 ? ((qtd / totalVotos) * 100).toFixed(1) : '0.0';
          htmlParciais += `<div class="parcial-item"><span>${c.nome} (${c.partido}):</span> <b>${pct}%</b></div>`;
        });

        let pctBranco = totalVotos > 0 ? ((brancos / totalVotos) * 100).toFixed(1) : '0.0';
        let pctNulo = totalVotos > 0 ? ((nulos / totalVotos) * 100).toFixed(1) : '0.0';

        htmlParciais += `<div class="parcial-item"><span>BRANCOS:</span> <b>${pctBranco}%</b></div>`;
        htmlParciais += `<div class="parcial-item"><span>NULOS:</span> <b>${pctNulo}%</b></div>`;

        lcd.innerHTML = `
          <div class="tela-espera" onclick="iniciarVotacaoDireta()">
            <div class="texto-votar">VOTAR</div>
            <div class="painel-parcial">
              <div style="font-weight:bold; border-bottom:1px solid #486148; margin-bottom:4px; padding-bottom:2px;">PARCIAIS (PERCENTUAL):</div>
              ${htmlParciais}
            </div>
            <div class="total-votos-div">Total de votos: ${totalVotos}</div>
            <div class="aviso-clique-tela">Clique na tela para votar</div>
          </div>
        `;
        return;
      }

      const etapa = ETAPAS[etapaAtual];
      const cand = candidatos.find(c => c.numero === numeroDigitado);
      
      let digitosHTML = '';
      for (let i = 0; i < etapa.digitos; i++) {
        const char = numeroDigitado[i] || '';
        const pisca = (i === numeroDigitado.length && !votoBranco) ? 'pisca' : '';
        digitosHTML += `<div class="digito-box ${pisca}">${char}</div>`;
      }

      let conteudoBody = '';
      if (votoBranco) {
        conteudoBody = `
          <div class="lcd-info-col">
            <div class="cargo-titulo">SEU VOTO VAI PARA</div>
            <div style="font-size:24px; margin-top:20px; color:#000;">VOTO EM BRANCO</div>
          </div>
        `;
      } else if (cand) {
        const fotoSrc = cand.foto ? cand.foto : '';
        conteudoBody = `
          <div class="lcd-info-col">
            <div class="cargo-titulo">${etapa.titulo}</div>
            <div class="caixas-numero">${digitosHTML}</div>
            <div class="dado-candidato"><b>${cand.nome}</b><br>Partido: <b>${cand.partido}</b></div>
          </div>
          <div class="lcd-foto-container">
            <img src="${fotoSrc}" alt="Foto ${cand.nome}">
          </div>
        `;
      } else if (numeroDigitado.length === etapa.digitos) {
        conteudoBody = `
          <div class="lcd-info-col">
            <div class="cargo-titulo">${etapa.titulo}</div>
            <div class="caixas-numero">${digitosHTML}</div>
            <div class="dado-candidato" style="color:#600;"><b>NÚMERO ERRADO</b><br><b>VOTO NULO</b></div>
          </div>
        `;
      } else {
        conteudoBody = `
          <div class="lcd-info-col">
            <div class="cargo-titulo">${etapa.titulo}</div>
            <div class="caixas-numero">${digitosHTML}</div>
          </div>
        `;
      }

      lcd.innerHTML = `
        <div class="lcd-header">
          <span>Eleições 2026</span>
          <span>${etapa.titulo}</span>
        </div>
        <div class="lcd-body">${conteudoBody}</div>
        <div class="lcd-instrucoes">Aperte:<br><b>VERDE</b> para CONFIRMAR<br><b>LARANJA</b> para CORRIGIR</div>
      `;
    }

    function iniciarVotacaoDireta() {
      votacaoIniciada = true;
      etapaAtual = 0;
      numeroDigitado = '';
      votoBranco = false;
      atualizarTela();
    }

    function digitar(n) {
      if (!votacaoIniciada || votoBranco || telaFimExibida) return;
      const max = ETAPAS[etapaAtual].digitos;
      if (numeroDigitado.length < max) {
        tocarBeep();
        numeroDigitado += n;
        atualizarTela();
      }
    }

    function votarBranco() {
      if (!votacaoIniciada || telaFimExibida) return;
      if (numeroDigitado === '') {
        tocarBeep();
        votoBranco = true;
        atualizarTela();
      }
    }

    function corrigir() {
      if (!votacaoIniciada || telaFimExibida) return;
      tocarBeep(1000);
      numeroDigitado = '';
      votoBranco = false;
      atualizarTela();
    }

    function confirmar() {
      if (!votacaoIniciada || telaFimExibida) return;
      const etapa = ETAPAS[etapaAtual];
      let votoRegistrado = null;

      if (votoBranco) {
        votoRegistrado = { numero: 'BRANCO', tipo: 'BRANCO', dataHora: new Date().toISOString() };
      } else if (numeroDigitado.length === etapa.digitos) {
        const cand = candidatos.find(c => c.numero === numeroDigitado);
        if (cand) votoRegistrado = { numero: cand.numero, partido: cand.partido, tipo: 'VALIDO', dataHora: new Date().toISOString() };
        else votoRegistrado = { numero: numeroDigitado, tipo: 'NULO', dataHora: new Date().toISOString() };
      }

      if (votoRegistrado) {
        votos.push(votoRegistrado);
        localStorage.setItem('urna_v6_votos', JSON.stringify(votos));
        processarFimDeVotacao();
      }
    }

    function processarFimDeVotacao() {
      telaFimExibida = true;
      atualizarTela();
      tocarSomFimUrna();

      setTimeout(() => {
        telaFimExibida = false;
        votacaoIniciada = false;
        etapaAtual = 0;
        numeroDigitado = '';
        votoBranco = false;
        atualizarTela();
      }, 3000);
    }

    function navegarEnter(event, proximoId) {
      if (event.key === 'Enter') {
        event.preventDefault();
        const proximo = document.getElementById(proximoId);
        if (proximo) proximo.focus();
      }
    }

    function abrirLoginAdmin() {
      document.getElementById('modalLogin').style.display = 'flex';
      setTimeout(() => document.getElementById('senhaAdmin').focus(), 150);
    }

    function fecharModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function autenticarAdmin() {
      const senha = document.getElementById('senhaAdmin').value;
      if (senha === '123') {
        document.getElementById('senhaAdmin').value = '';
        fecharModal('modalLogin');
        document.getElementById('modalPainel').style.display = 'flex';
        renderizarTabelaCandidatos();
        mostrarAba('abaCad');
      } else {
        alert('Senha incorreta! (Senha padrão: 123)');
      }
    }

    function mostrarAba(abaId) {
      document.getElementById('abaCad').style.display = abaId === 'abaCad' ? 'block' : 'none';
      document.getElementById('abaRel').style.display = abaId === 'abaRel' ? 'block' : 'none';
      document.getElementById('abaSom').style.display = abaId === 'abaSom' ? 'block' : 'none';

      if (abaId === 'abaCad') setTimeout(() => document.getElementById('cadNome').focus(), 150);
    }

    function salvarCandidato() {
      const nome = document.getElementById('cadNome').value.trim().toUpperCase();
      const numero = document.getElementById('cadNumero').value.trim();
      const partido = document.getElementById('cadPartido').value.trim().toUpperCase();
      const foto = document.getElementById('cadFotoUrl').value.trim();

      if (!nome || !numero || !partido) {
        alert('Preencha nome, número e partido!');
        return;
      }

      candidatos.push({ numero, nome, partido, foto });
      localStorage.setItem('urna_v6_candidatos', JSON.stringify(candidatos));

      document.getElementById('cadNome').value = '';
      document.getElementById('cadNumero').value = '';
      document.getElementById('cadPartido').value = '';
      document.getElementById('cadFotoUrl').value = '';
      renderizarTabelaCandidatos();
      alert('Candidato cadastrado com sucesso!');
    }

    function renderizarTabelaCandidatos() {
      const tabela = document.getElementById('tabelaCandidatos');
      let html = '<tr><th>Número</th><th>Nome</th><th>Partido</th><th>Ações</th></tr>';
      candidatos.forEach((c, index) => {
        html += `
          <tr>
            <td><b>${c.numero}</b></td>
            <td>${c.nome}</td>
            <td>${c.partido}</td>
            <td>
              <span style="color:#0056b3; cursor:pointer; margin-right:8px;" onclick="abrirEditar(${index})">Editar</span>
              <span style="color:#dc3545; cursor:pointer;" onclick="excluirCandidato(${index})">Excluir</span>
            </td>
          </tr>
        `;
      });
      tabela.innerHTML = html;
    }

    function abrirEditar(index) {
      const c = candidatos[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('editNome').value = c.nome;
      document.getElementById('editNumero').value = c.numero;
      document.getElementById('editPartido').value = c.partido;
      document.getElementById('editFotoUrl').value = c.foto || '';
      document.getElementById('modalEditar').style.display = 'flex';
    }

    function salvarEdicaoCandidato() {
      const index = document.getElementById('editIndex').value;
      const nome = document.getElementById('editNome').value.trim().toUpperCase();
      const numero = document.getElementById('editNumero').value.trim();
      const partido = document.getElementById('editPartido').value.trim().toUpperCase();
      const foto = document.getElementById('editFotoUrl').value.trim();

      if (!nome || !numero || !partido) {
        alert('Preencha todos os campos principais!');
        return;
      }

      candidatos[index] = { numero, nome, partido, foto };
      localStorage.setItem('urna_v6_candidatos', JSON.stringify(candidatos));
      fecharModal('modalEditar');
      renderizarTabelaCandidatos();
      alert('Alterações salvas com sucesso!');
    }

    function excluirCandidato(index) {
      if (confirm('Deseja realmente excluir este candidato?')) {
        candidatos.splice(index, 1);
        localStorage.setItem('urna_v6_candidatos', JSON.stringify(candidatos));
        renderizarTabelaCandidatos();
      }
    }

    function zerarVotos() {
      if (confirm('Deseja zerar todos os votos computados?')) {
        votos = [];
        localStorage.removeItem('urna_v6_votos');
        alert('Urna zerada com sucesso!');
        document.getElementById('areaImpressao').style.display = 'none';
      }
    }

    function imprimirZeresima() {
      let dataStr = new Date().toLocaleString();
      let textoHeader = `       JUSTIÇA ELEITORAL        \n       RELATÓRIO DE ZERÉSIMA    \n`;
      let textoCorpo = `================================\nDATA/HORA: ${dataStr}\nURNA: 2026-BRASIL\n--------------------------------\nVOTOS REGISTRADOS: 0 (ZERO)\n--------------------------------\nCANDIDATOS CADASTRADOS:\n`;
      candidatos.forEach(c => {
        textoCorpo += `- [${c.numero}] ${c.nome} (${c.partido})\n`;
      });
      textoCorpo += `================================\n   ZERÉSIMA EMITIDA COM SUCESSO \n================================`;
      
      const area = document.getElementById('areaImpressao');
      area.style.display = 'block';
      area.innerHTML = `<div class="papel-header">${textoHeader.trim()}</div>${textoCorpo}`;
    }

    function imprimirBoletimUrna() {
      let dataStr = new Date().toLocaleString();
      let totalVotos = votos.length;
      let contagem = {};
      let brancos = 0;
      let nulos = 0;

      candidatos.forEach(c => contagem[c.numero] = 0);
      votos.forEach(v => {
        if (v.tipo === 'VALIDO') contagem[v.numero] = (contagem[v.numero] || 0) + 1;
        else if (v.tipo === 'BRANCO') brancos++;
        else if (v.tipo === 'NULO') nulos++;
      });

      let textoHeader = `       JUSTIÇA ELEITORAL        \n       BOLETIM DE URNA (BU)     \n`;
      let textoCorpo = `================================\nDATA/HORA: ${dataStr}\nTOTAL DE VOTOS: ${totalVotos}\n--------------------------------\nVOTAÇÃO POR CANDIDATO:\n`;
      candidatos.forEach(c => {
        let q = contagem[c.numero] || 0;
        let p = totalVotos > 0 ? ((q / totalVotos)*100).toFixed(1) : '0.0';
        textoCorpo += `${c.nome} (${c.partido}): ${q} (${p}%)\n`;
      });
      textoCorpo += `--------------------------------\nVotos Brancos: ${brancos}\nVotos Nulos: ${nulos}\n================================\n    FIM DO BOLETIM DE URNA      \n================================`;

      const area = document.getElementById('areaImpressao');
      area.style.display = 'block';
      area.innerHTML = `<div class="papel-header">${textoHeader.trim()}</div>${textoCorpo}`;
    }

    atualizarTela();
  </script>
</body>
</html>
