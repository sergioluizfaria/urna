<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>URNA ELETRÔNICA</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Container Principal - Formato Celular Pop-up no Desktop / Fullsize no Mobile */
    .urna-container {
      width: 100%;
      height: 100%;
      max-width: 420px;
      max-height: 860px;
      background: #d8d8d8;
      border: 3px solid #555;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
    }

    @media (max-width: 480px) {
      .urna-container {
        max-width: 100vw;
        max-height: 100vh;
        border-radius: 0;
        border: none;
      }
    }

    /* Topo / Barra Superior */
    .topo-urna {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #999;
      padding-bottom: 6px;
      margin-bottom: 6px;
    }
    .topo-urna h2 {
      margin: 0;
      font-size: 16px;
      color: #111;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-admin-access {
      background: #333;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    /* Tela LCD */
    .tela-lcd {
      background-color: #8cb88b;
      border: 4px solid #486148;
      border-radius: 8px;
      flex: 1;
      min-height: 240px;
      padding: 12px;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.4);
      color: #041c04;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .lcd-header {
      font-size: 13px;
      text-transform: uppercase;
      border-bottom: 2px solid #486148;
      padding-bottom: 4px;
    }

    .lcd-body {
      display: flex;
      flex: 1;
      margin-top: 8px;
    }

    .lcd-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cargo-titulo {
      font-size: 18px;
      text-transform: uppercase;
      color: #000;
    }

    .caixas-numero {
      display: flex;
      gap: 6px;
      margin: 8px 0;
    }

    .digito-box {
      width: 32px;
      height: 40px;
      border: 3px solid #041c04;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      background: rgba(255,255,255,0.25);
    }

    .digito-box.pisca {
      animation: piscar 0.8s infinite;
    }

    @keyframes piscar {
      0%, 100% { border-color: #041c04; }
      50% { border-color: transparent; }
    }

    .dado-candidato {
      font-size: 15px;
      line-height: 1.3;
    }

    .lcd-foto-container {
      width: 120px;
      height: 150px;
      border: 3px solid #041c04;
      background: #a2c8a2;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      text-align: center;
      overflow: hidden;
    }

    .lcd-foto-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .lcd-instrucoes {
      border-top: 2px solid #486148;
      padding-top: 6px;
      font-size: 11px;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .tela-fim {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      font-size: 56px;
      letter-spacing: 4px;
      color: #000;
    }

    .tela-bloqueio {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      font-size: 16px;
      color: #800;
      line-height: 1.4;
      padding: 10px;
    }

    /* Teclado da Urna */
    .teclado {
      background: #1a1a1a;
      padding: 12px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .teclado-numerico {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .btn-num {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 12px 0;
      font-size: 20px;
      box-shadow: 0 4px 0 #000;
      cursor: pointer;
      text-align: center;
    }

    .btn-num:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #000;
    }

    .teclado-linha-zero {
      display: flex;
      justify-content: center;
    }
    .teclado-linha-zero .btn-num {
      width: 32%;
    }

    .teclado-acoes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 4px;
    }

    .btn-acao {
      border: none;
      border-radius: 6px;
      padding: 12px 2px;
      font-size: 11px;
      text-transform: uppercase;
      box-shadow: 0 4px 0 rgba(0,0,0,0.6);
      cursor: pointer;
      color: #000;
    }

    .btn-acao:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.6);
    }

    .btn-branco { background-color: #ffffff; }
    .btn-correge { background-color: #ff5500; }
    .btn-confirma { background-color: #00aa00; font-size: 12px; }

    /* Modais / Popups */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-card {
      background: #fff;
      width: 100%;
      max-width: 400px;
      border-radius: 10px;
      padding: 18px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      color: #222;
    }

    .modal-card h3 {
      margin-top: 0;
      font-size: 18px;
      border-bottom: 2px solid #ddd;
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 14px;
      color: #333;
    }

    .input-uppercase {
      text-transform: uppercase;
    }

    .form-group input, .form-group select, .form-group textarea {
      padding: 10px;
      border: 2px solid #bbb;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn-modal {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
      margin-top: 6px;
    }

    .btn-fechar {
      background: #6c757d;
    }

    /* Estrutura do Relatório Limpo (Flutuante, Sem Linhas/Grades e Sem Scroll) */
    .relatorio-flutuante {
      background: #fdfdfd;
      padding: 10px 14px;
      font-family: Arial, sans-serif !important;
      font-size: 13px;
      font-weight: normal !important;
      color: #111;
      margin-top: 10px;
      line-height: 1.5;
      overflow: hidden;
    }

    .relatorio-flutuante * {
      font-family: Arial, sans-serif !important;
      font-weight: normal !important;
    }

    .relatorio-header {
      text-align: center;
      font-size: 14px;
      font-weight: bold !important;
      margin-bottom: 10px;
    }

    .item-relatorio {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .link-sobre {
      color: #0056b3;
      text-decoration: underline;
      cursor: pointer;
      font-weight: bold !important;
    }

    .lista-admin-cand {
      font-size: 13px;
      width: 100%;
      margin-top: 10px;
      border-collapse: collapse;
    }
    .lista-admin-cand td, .lista-admin-cand th {
      padding: 6px 0;
      text-align: left;
    }

    /* Padrão para Paginação de IPs */
    .paginacao-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .btn-paginacao {
      background: #333;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-paginacao:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- CONTAINER URNA ELETRÔNICA -->
  <div class="urna-container">
    <div class="topo-urna">
      <h2>URNA ELETRÔNICA</h2>
      <button class="btn-admin-access" onclick="abrirLoginAdmin()">ADMIN</button>
    </div>

    <!-- TELA LCD -->
    <div class="tela-lcd" id="telaLCD"></div>

    <!-- TECLADO -->
    <div class="teclado">
      <div class="teclado-numerico">
        <button class="btn-num" onclick="digitar('1')">1</button>
        <button class="btn-num" onclick="digitar('2')">2</button>
        <button class="btn-num" onclick="digitar('3')">3</button>
        <button class="btn-num" onclick="digitar('4')">4</button>
        <button class="btn-num" onclick="digitar('5')">5</button>
        <button class="btn-num" onclick="digitar('6')">6</button>
        <button class="btn-num" onclick="digitar('7')">7</button>
        <button class="btn-num" onclick="digitar('8')">8</button>
        <button class="btn-num" onclick="digitar('9')">9</button>
      </div>
      <div class="teclado-linha-zero">
        <button class="btn-num" onclick="digitar('0')">0</button>
      </div>

      <div class="teclado-acoes">
        <button class="btn-action btn-branco btn-acao" onclick="votarBranco()">BRANCO</button>
        <button class="btn-action btn-correge btn-acao" onclick="corrigir()">CORRIGE</button>
        <button class="btn-action btn-confirma btn-acao" onclick="confirmar()">CONFIRMA</button>
      </div>
    </div>
  </div>

  <!-- MODAL SOBRE O APLICATIVO -->
  <div class="modal-overlay" id="modalSobre">
    <div class="modal-card">
      <h3>Sobre o Aplicativo</h3>
      <div id="conteudoSobreTexto" style="font-weight:normal; font-size:14px; line-height:1.5; white-space:pre-wrap; margin-bottom:15px;"></div>
      <button class="btn-modal btn-fechar" onclick="fecharModal('modalSobre')">Fechar</button>
    </div>
  </div>

  <!-- MODAL LOGIN ADMIN -->
  <div class="modal-overlay" id="modalLogin">
    <div class="modal-card">
      <h3>Acesso Restrito - Admin</h3>
      <div class="form-group">
        <label>Senha de Acesso:</label>
        <input type="password" id="senhaAdmin" placeholder="Digite a senha" onkeydown="if(event.key==='Enter') autenticarAdmin()">
      </div>
      <button class="btn-modal" onclick="autenticarAdmin()">Entrar</button>
      <button class="btn-modal btn-fechar" onclick="fecharModal('modalLogin')">Cancelar</button>
    </div>
  </div>

  <!-- MODAL PAINEL ADMIN PRINCIPAL -->
  <div class="modal-overlay" id="modalPainel">
    <div class="modal-card">
      <h3>Painel do Administrador</h3>
      
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 12px;">
        <button class="btn-modal" style="background:#28a745; margin:0;" onclick="mostrarAba('abaCad')">Cadastrar</button>
        <button class="btn-modal" style="background:#17a2b8; margin:0;" onclick="mostrarAba('abaRel')">Relatórios</button>
        <button class="btn-modal" style="background:#ffc107; color:#000; margin:0;" onclick="mostrarAba('abaSobreAdmin')">Sobre</button>
        <button class="btn-modal" style="background:#6c757d; margin:0;" onclick="mostrarAba('abaIps')">Visitantes / IPs</button>
      </div>

      <!-- Aba Cadastro -->
      <div id="abaCad">
        <h4>Novo Candidato</h4>
        <div class="form-group">
          <label>Nome do Candidato:</label>
          <input type="text" id="cadNome" class="input-uppercase" placeholder="EX: JOÃO SILVA" onkeydown="navegarEnter(event, 'cadNumero')">
        </div>
        <div class="form-group">
          <label>Número do Candidato:</label>
          <input type="number" id="cadNumero" placeholder="EX: 13, 22, 15123" onkeydown="navegarEnter(event, 'cadPartido')">
        </div>
        <div class="form-group">
          <label>Sigla do Partido:</label>
          <input type="text" id="cadPartido" class="input-uppercase" placeholder="EX: PT, PL, MDB" onkeydown="navegarEnter(event, 'cadFotoUrl')">
        </div>
        <div class="form-group">
          <label>Foto 3x4 (Upload ou URL):</label>
          <input type="file" id="cadFotoFile" accept="image/*" onchange="converterFotoBase64(this, 'NOVO')">
          <input type="text" id="cadFotoUrl" placeholder="Ou cole a URL da imagem" onkeydown="if(event.key==='Enter') salvarCandidato()">
        </div>
        <button class="btn-modal" id="btnSalvarCand" onclick="salvarCandidato()">Salvar Candidato</button>

        <h4 style="margin-top: 18px;">Candidatos Cadastrados</h4>
        <div style="overflow-x:auto;">
          <table class="lista-admin-cand" id="tabelaCandidatos"></table>
        </div>
      </div>

      <!-- Aba Relatórios -->
      <div id="abaRel" style="display:none;">
        <button class="btn-modal" style="background:#ffc107; color:#000;" onclick="imprimirZeresima()">Exibir Zeresima</button>
        <button class="btn-modal" style="background:#6f42c1" onclick="imprimirBoletimUrna()">Exibir Boletim de Urna (BU)</button>
        <button class="btn-modal" style="background:#dc3545" onclick="zerarVotos()">Zerar Votação e IPs</button>

        <div id="areaImpressao" class="relatorio-flutuante" style="display:none;"></div>
      </div>

      <!-- Aba Editar Sobre -->
      <div id="abaSobreAdmin" style="display:none;">
        <h4>Texto Informativo "Sobre"</h4>
        <div class="form-group">
          <label>Conteúdo da Seção Sobre:</label>
          <textarea id="textoSobreInput" rows="6" placeholder="Digite aqui o texto sobre o aplicativo..."></textarea>
        </div>
        <button class="btn-modal" style="background:#28a745;" onclick="salvarTextoSobre()">Salvar Texto</button>
      </div>

      <!-- Aba Visitantes / IPs -->
      <div id="abaIps" style="display:none;">
        <h4>Registro de Acessos</h4>
        <div style="font-size:14px; margin-bottom:10px;">
          Total de Visitas: <b id="contadorVisitas">0</b>
        </div>
        
        <button class="btn-modal" style="background:#17a2b8; margin-bottom:10px;" onclick="exportarIpsTxt()">Exportar Lista em TXT</button>

        <div id="listaIpsContainer" style="font-size:13px; font-weight:normal;"></div>
        
        <div class="paginacao-container">
          <button class="btn-paginacao" id="btnPagAnt" onclick="mudarPaginaIp(-1)">&lt;</button>
          <span id="infoPaginacao" style="font-size:12px;">Página 1</span>
          <button class="btn-paginacao" id="btnPagProx" onclick="mudarPaginaIp(1)">&gt;</button>
        </div>
      </div>

      <button class="btn-modal btn-fechar" style="margin-top:15px;" onclick="fecharModal('modalPainel')">Sair do Painel</button>
    </div>
  </div>

  <!-- MODAL EDITAR CANDIDATO POPUP -->
  <div class="modal-overlay" id="modalEditar">
    <div class="modal-card">
      <h3>Editar Candidato</h3>
      <input type="hidden" id="editIndex">
      
      <div class="form-group">
        <label>Nome do Candidato:</label>
        <input type="text" id="editNome" class="input-uppercase" onkeydown="navegarEnter(event, 'editNumero')">
      </div>
      <div class="form-group">
        <label>Número:</label>
        <input type="number" id="editNumero" onkeydown="navegarEnter(event, 'editPartido')">
      </div>
      <div class="form-group">
        <label>Sigla do Partido:</label>
        <input type="text" id="editPartido" class="input-uppercase" onkeydown="navegarEnter(event, 'editFotoUrl')">
      </div>
      <div class="form-group">
        <label>Nova Foto 3x4 (Upload ou URL):</label>
        <input type="file" id="editFotoFile" accept="image/*" onchange="converterFotoBase64(this, 'EDIT')">
        <input type="text" id="editFotoUrl" placeholder="Ou cole a URL da foto" onkeydown="if(event.key==='Enter') salvarEdicaoCandidato()">
      </div>

      <button class="btn-modal" style="background:#28a745" onclick="salvarEdicaoCandidato()">Salvar Alterações</button>
      <button class="btn-modal btn-fechar" onclick="fecharModal('modalEditar')">Cancelar</button>
    </div>
  </div>

  <script>
    /* ==========================================================
       BLOQUEIO DE INSPEÇÃO (F12 E BOTÃO DIREITO)
    ========================================================== */
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('keydown', event => {
      if (
        event.key === 'F12' || 
        (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'i' || event.key === 'J' || event.key === 'j' || event.key === 'C' || event.key === 'c')) ||
        (event.ctrlKey && (event.key === 'U' || event.key === 'u'))
      ) {
        event.preventDefault();
      }
    });

    /* ==========================================================
       HASH DE SEGURANÇA DA SENHA ADMIN
    ========================================================== */
    // Hash do valor '300999300'
    const ADMIN_PASS_HASH = 129480665;

    function gerarHash(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash |= 0;
      }
      return Math.abs(hash);
    }

    /* ==========================================================
       CONFIGURAÇÕES, IP E ARMAZENAMENTO LOCAL
    ========================================================== */
    const ETAPAS = [
      { titulo: 'PRESIDENTE', digitos: 2 }
    ];

    let candidatos = [
      { numero: '13', nome: 'LULA', partido: 'PT', foto: 'fotos/lula.jpg' },
      { numero: '22', nome: 'BOLSONARO', partido: 'PL', foto: 'fotos/bolsonaro.jpg' }
    ];

    let votos = [];
    let ipsVotaram = [];
    let listaVisitantes = [];
    let contadorVisitas = 0;
    let clienteIP = '';
    let jaVotou = false;

    let textoSobre = "Esta é uma simulação da Urna Eletrônica desenvolvida para fins de votação e consulta pública.";

    let etapaAtual = 0;
    let numeroDigitado = '';
    let votoBranco = false;
    let fotoTempBase64Novo = '';
    let fotoTempBase64Edit = '';
    let paginaAtualIp = 1;

    // Restauração de Dados
    if (localStorage.getItem('urna_v3_candidatos')) {
      candidatos = JSON.parse(localStorage.getItem('urna_v3_candidatos'));
    }
    if (localStorage.getItem('urna_v3_votos')) {
      votos = JSON.parse(localStorage.getItem('urna_v3_votos'));
    }
    if (localStorage.getItem('urna_ips_votaram')) {
      ipsVotaram = JSON.parse(localStorage.getItem('urna_ips_votaram'));
    }
    if (localStorage.getItem('urna_lista_visitantes')) {
      listaVisitantes = JSON.parse(localStorage.getItem('urna_lista_visitantes'));
    }
    if (localStorage.getItem('urna_contador_visitas')) {
      contadorVisitas = parseInt(localStorage.getItem('urna_contador_visitas')) || 0;
    }
    if (localStorage.getItem('urna_texto_sobre')) {
      textoSobre = localStorage.getItem('urna_texto_sobre');
    }

    /* ==========================================================
       CAPTUAR IP E REGISTRAR VISITA
    ========================================================== */
    async function capturarIpEVerificar() {
      try {
        const resp = await fetch('https://api.ipify.org?format=json');
        const data = await resp.json();
        clienteIP = data.ip;
      } catch (e) {
        clienteIP = 'IP_LOCAL_' + Math.floor(Math.random() * 100000);
      }

      // Registrar visita
      contadorVisitas++;
      localStorage.setItem('urna_contador_visitas', contadorVisitas);

      const dataHora = new Date().toLocaleString('pt-BR');
      listaVisitantes.unshift({ ip: clienteIP, data: dataHora });
      localStorage.setItem('urna_lista_visitantes', JSON.stringify(listaVisitantes));

      // Verificar se o IP já votou
      if (ipsVotaram.includes(clienteIP)) {
        jaVotou = true;
      }

      atualizarTela();
    }

    /* ==========================================================
       ÁUDIO DA URNA ELETRÔNICA
    ========================================================== */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function tocarBeep(freq = 1300, duracao = 0.05) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duracao);
    }

    function tocarSomFimUrna() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc1.type = 'sine';
      osc2.type = 'sine';

      osc1.frequency.setValueAtTime(520, t);
      osc1.frequency.setValueAtTime(780, t + 0.15);

      osc2.frequency.setValueAtTime(660, t);
      osc2.frequency.setValueAtTime(980, t + 0.15);

      gain.gain.setValueAtTime(0.2, t);
      gain.gain.linearRampToValueAtTime(0.2, t + 1.1);
      gain.gain.linearRampToValueAtTime(0, t + 1.25);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(t);
      osc2.start(t);
      osc1.stop(t + 1.25);
      osc2.stop(t + 1.25);
    }

    /* ==========================================================
       TELA LCD E VOTAÇÃO
    ========================================================== */
    function atualizarTela() {
      const lcd = document.getElementById('telaLCD');

      if (jaVotou) {
        lcd.innerHTML = `
          <div class="tela-bloqueio">
            <b>VOTO JÁ REGISTRADO</b><br><br>
            Você já exerceu seu voto neste dispositivo/rede.
          </div>`;
        return;
      }

      const etapa = ETAPAS[etapaAtual];

      if (!etapa) {
        lcd.innerHTML = `<div class="tela-fim">FIM</div>`;
        tocarSomFimUrna();
        setTimeout(() => {
          etapaAtual = 0;
          numeroDigitado = '';
          votoBranco = false;
          atualizarTela();
        }, 3200);
        return;
      }

      const cand = candidatos.find(c => c.numero === numeroDigitado);

      let digitosHTML = '';
      for (let i = 0; i < etapa.digitos; i++) {
        const char = numeroDigitado[i] || '';
        const pisca = (i === numeroDigitado.length && !votoBranco) ? 'pisca' : '';
        digitosHTML += `<div class="digito-box ${pisca}">${char}</div>`;
      }

      let conteudoBody = '';
      if (votoBranco) {
        conteudoBody = `
          <div class="lcd-info">
            <div class="cargo-titulo">SEU VOTO VAI PARA</div>
            <div style="font-size:24px; margin-top:20px;">VOTO EM BRANCO</div>
          </div>
        `;
      } else if (cand) {
        conteudoBody = `
          <div class="lcd-info">
            <div class="cargo-titulo">${etapa.titulo}</div>
            <div class="caixas-numero">${digitosHTML}</div>
            <div class="dado-candidato">
              Nome: <b>${cand.nome}</b><br>
              Partido: <b>${cand.partido}</b>
            </div>
          </div>
          <div class="lcd-foto-container">
            <img src="${cand.foto}" alt="Foto 3x4" onerror="this.onerror=null; this.src='https://via.placeholder.com/100x130?text=Sem+Foto';">
          </div>
        `;
      } else if (numeroDigitado.length === etapa.digitos) {
        conteudoBody = `
          <div class="lcd-info">
            <div class="cargo-titulo">${etapa.titulo}</div>
            <div class="caixas-numero">${digitosHTML}</div>
            <div class="dado-candidato" style="margin-top:10px; color:#600;">
              <b>NÚMERO ERRADO</b><br>
              <b>VOTO NULO</b>
            </div>
          </div>
        `;
      } else {
        conteudoBody = `
          <div class="lcd-info">
            <div class="cargo-titulo">${etapa.titulo}</div>
            <div class="caixas-numero">${digitosHTML}</div>
          </div>
        `;
      }

      lcd.innerHTML = `
        <div class="lcd-header">URNA ELETRÔNICA</div>
        <div class="lcd-body">${conteudoBody}</div>
        <div class="lcd-instrucoes">
          Aperte:<br>
          <b>VERDE</b> para CONFIRMAR<br>
          <b>LARANJA</b> para CORRIGIR
        </div>
      `;
    }

    /* ==========================================================
       AÇÕES DO TECLADO
    ========================================================== */
    function digitar(n) {
      if (votoBranco || jaVotou) return;
      const max = ETAPAS[etapaAtual].digitos;
      if (numeroDigitado.length < max) {
        tocarBeep();
        numeroDigitado += n;
        atualizarTela();
      }
    }

    function votarBranco() {
      if (jaVotou) return;
      if (numeroDigitado === '') {
        tocarBeep();
        votoBranco = true;
        atualizarTela();
      }
    }

    function corrigir() {
      if (jaVotou) return;
      tocarBeep(1000);
      numeroDigitado = '';
      votoBranco = false;
      atualizarTela();
    }

    function confirmar() {
      if (jaVotou) return;
      const etapa = ETAPAS[etapaAtual];
      let votoRegistrado = null;

      if (votoBranco) {
        votoRegistrado = { numero: 'BRANCO', tipo: 'BRANCO' };
      } else if (numeroDigitado.length === etapa.digitos) {
        const cand = candidatos.find(c => c.numero === numeroDigitado);
        if (cand) {
          votoRegistrado = { numero: cand.numero, partido: cand.partido, tipo: 'VALIDO' };
        } else {
          votoRegistrado = { numero: numeroDigitado, tipo: 'NULO' };
        }
      }

      if (votoRegistrado) {
        votos.push(votoRegistrado);
        localStorage.setItem('urna_v3_votos', JSON.stringify(votos));

        // Registrar IP que efetuou o voto
        ipsVotaram.push(clienteIP);
        localStorage.setItem('urna_ips_votaram', JSON.stringify(ipsVotaram));
        jaVotou = true;

        etapaAtual++;
        numeroDigitado = '';
        votoBranco = false;
        atualizarTela();
      }
    }

    /* ==========================================================
       NAVEGAÇÃO E MODAIS
    ========================================================== */
    function navegarEnter(event, proximoId) {
      if (event.key === 'Enter') {
        event.preventDefault();
        const proximo = document.getElementById(proximoId);
        if (proximo) proximo.focus();
      }
    }

    function abrirLoginAdmin() {
      document.getElementById('modalLogin').style.display = 'flex';
      setTimeout(() => document.getElementById('senhaAdmin').focus(), 150);
    }

    function fecharModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function abrirModalSobre() {
      document.getElementById('conteudoSobreTexto').innerText = textoSobre;
      document.getElementById('modalSobre').style.display = 'flex';
    }

    function autenticarAdmin() {
      const entrada = document.getElementById('senhaAdmin').value;
      if (gerarHash(entrada) === ADMIN_PASS_HASH) {
        document.getElementById('senhaAdmin').value = '';
        fecharModal('modalLogin');
        document.getElementById('modalPainel').style.display = 'flex';
        renderizarTabelaCandidatos();
        mostrarAba('abaCad');
      } else {
        alert('Senha Incorreta!');
      }
    }

    function mostrarAba(abaId) {
      document.getElementById('abaCad').style.display = abaId === 'abaCad' ? 'block' : 'none';
      document.getElementById('abaRel').style.display = abaId === 'abaRel' ? 'block' : 'none';
      document.getElementById('abaSobreAdmin').style.display = abaId === 'abaSobreAdmin' ? 'block' : 'none';
      document.getElementById('abaIps').style.display = abaId === 'abaIps' ? 'block' : 'none';

      if (abaId === 'abaCad') {
        setTimeout(() => document.getElementById('cadNome').focus(), 150);
      } else if (abaId === 'abaSobreAdmin') {
        document.getElementById('textoSobreInput').value = textoSobre;
      } else if (abaId === 'abaIps') {
        renderizarListaIps();
      }
    }

    /* ==========================================================
       GERENCIAMENTO DE CANDIDATOS E SOBRE
    ========================================================== */
    function salvarTextoSobre() {
      textoSobre = document.getElementById('textoSobreInput').value;
      localStorage.setItem('urna_texto_sobre', textoSobre);
      alert('Texto "Sobre" atualizado com sucesso!');
    }

    function converterFotoBase64(input, modo) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          if (modo === 'NOVO') fotoTempBase64Novo = e.target.result;
          else if (modo === 'EDIT') fotoTempBase64Edit = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function salvarCandidato() {
      const nomeInput = document.getElementById('cadNome');
      const numeroInput = document.getElementById('cadNumero');
      const partidoInput = document.getElementById('cadPartido');
      const fotoUrlInput = document.getElementById('cadFotoUrl');
      const fotoFileInput = document.getElementById('cadFotoFile');

      const nome = nomeInput.value.trim().toUpperCase();
      const numero = numeroInput.value.trim();
      const partido = partidoInput.value.trim().toUpperCase();

      let foto = fotoTempBase64Novo || fotoUrlInput.value.trim() || 'https://via.placeholder.com/100x130?text=3x4';

      if (!nome || !numero || !partido) {
        alert('Preencha Nome, Número e Partido!');
        return;
      }

      candidatos.push({ numero, nome, partido, foto });
      localStorage.setItem('urna_v3_candidatos', JSON.stringify(candidatos));

      nomeInput.value = '';
      numeroInput.value = '';
      partidoInput.value = '';
      fotoUrlInput.value = '';
      fotoFileInput.value = '';
      fotoTempBase64Novo = '';

      nomeInput.focus();
      renderizarTabelaCandidatos();
      atualizarTela();
      alert('Candidato cadastrado!');
    }

    function abrirEditarCandidato(idx) {
      const c = candidatos[idx];
      document.getElementById('editIndex').value = idx;
      document.getElementById('editNome').value = c.nome;
      document.getElementById('editNumero').value = c.numero;
      document.getElementById('editPartido').value = c.partido;
      document.getElementById('editFotoUrl').value = c.foto.startsWith('data:') ? '' : c.foto;
      fotoTempBase64Edit = '';

      document.getElementById('modalEditar').style.display = 'flex';
      setTimeout(() => document.getElementById('editNome').focus(), 150);
    }

    function salvarEdicaoCandidato() {
      const idx = document.getElementById('editIndex').value;
      const nome = document.getElementById('editNome').value.trim().toUpperCase();
      const numero = document.getElementById('editNumero').value.trim();
      const partido = document.getElementById('editPartido').value.trim().toUpperCase();
      const fotoUrl = document.getElementById('editFotoUrl').value.trim();

      if (!nome || !numero || !partido) {
        alert('Preencha os campos obrigatórios!');
        return;
      }

      let foto = fotoTempBase64Edit || fotoUrl || candidatos[idx].foto;

      candidatos[idx] = { numero, nome, partido, foto };
      localStorage.setItem('urna_v3_candidatos', JSON.stringify(candidatos));

      fecharModal('modalEditar');
      renderizarTabelaCandidatos();
      atualizarTela();
      alert('Candidato atualizado com sucesso!');
    }

    function removerCandidato(index) {
      if (confirm('Deseja excluir este candidato?')) {
        candidatos.splice(index, 1);
        localStorage.setItem('urna_v3_candidatos', JSON.stringify(candidatos));
        renderizarTabelaCandidatos();
        atualizarTela();
      }
    }

    function renderizarTabelaCandidatos() {
      const tabela = document.getElementById('tabelaCandidatos');
      tabela.innerHTML = '';
      candidatos.forEach((c, idx) => {
        tabela.innerHTML += `
          <tr>
            <td><b>${c.numero}</b> - ${c.nome} (${c.partido})</td>
            <td style="text-align:right;">
              <span class="link-editar" onclick="abrirEditarCandidato(${idx})">Editar</span> 
              <span class="link-editar" style="color:red; margin-left:8px;" onclick="removerCandidato(${idx})">Excluir</span>
            </td>
          </tr>
        `;
      });
    }

    /* ==========================================================
       PAGINAÇÃO E EXPORTAÇÃO DE IPS / VISITANTES
    ========================================================== */
    function renderizarListaIps() {
      document.getElementById('contadorVisitas').innerText = contadorVisitas;
      const container = document.getElementById('listaIpsContainer');
      const totalPaginas = Math.ceil(listaVisitantes.length / 10) || 1;

      if (paginaAtualIp > totalPaginas) paginaAtualIp = totalPaginas;
      if (paginaAtualIp < 1) paginaAtualIp = 1;

      const inicio = (paginaAtualIp - 1) * 10;
      const fim = inicio + 10;
      const paginaItens = listaVisitantes.slice(inicio, fim);

      let html = '';
      paginaItens.forEach((item, i) => {
        html += `<div style="padding:4px 0; border-bottom:1px solid #eee;">
          <b>${inicio + i + 1}.</b> ${item.ip} - <span style="color:#666; font-size:11px;">${item.data}</span>
        </div>`;
      });

      container.innerHTML = html || 'Nenhum acesso registrado.';

      document.getElementById('infoPaginacao').innerText = `Página ${paginaAtualIp} de ${totalPaginas}`;
      document.getElementById('btnPagAnt').disabled = (paginaAtualIp === 1);
      document.getElementById('btnPagProx').disabled = (paginaAtualIp === totalPaginas);
    }

    function mudarPaginaIp(delta) {
      paginaAtualIp += delta;
      renderizarListaIps();
    }

    function exportarIpsTxt() {
      let conteudo = `RELATÓRIO DE ACESSOS E IPS\nTotal de Visitas: ${contadorVisitas}\n\n`;
      listaVisitantes.forEach((item, i) => {
        conteudo += `${i + 1}. IP: ${item.ip} | Data/Hora: ${item.data}\n`;
      });

      const blob = new Blob([conteudo], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'lista_visitantes_ips.txt';
      link.click();
    }

    /* ==========================================================
       RELATÓRIOS E PERCENTUAIS (FLUTUANTES)
    ========================================================== */
    function obterDataHora() {
      const d = new Date();
      return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR');
    }

    function imprimirZeresima() {
      const area = document.getElementById('areaImpressao');
      area.style.display = 'block';

      let textoCandidatos = '';
      candidatos.forEach(c => {
        textoCandidatos += `
          <div class="item-relatorio">
            <span>${c.numero} ${c.nome} (${c.partido})</span>
            <span>0 votos (0.0%)</span>
          </div>`;
      });

      area.innerHTML = `
        <div class="relatorio-header">
          URNA ELETRÔNICA<br>
          RELATÓRIO DE ZERÉSIMA
        </div>
        <div style="margin-bottom:10px; font-size:11px; text-align:center;">${obterDataHora()}</div>
        ${textoCandidatos}
        <div class="item-relatorio" style="margin-top:6px;">
          <span>VOTOS EM BRANCO</span>
          <span>0</span>
        </div>
        <div class="item-relatorio">
          <span>VOTOS NULOS</span>
          <span>0</span>
        </div>
        <div class="item-relatorio" style="font-weight:bold !important; margin-top:2px;">
          <span>Total de votos: 0</span>
        </div>
        <br><br><br>
        <div style="text-align:center;">
          <span class="link-sobre" onclick="abrirModalSobre()">Sobre</span>
        </div>
      `;
    }

    function imprimirBoletimUrna() {
      const area = document.getElementById('areaImpressao');
      area.style.display = 'block';

      let contagem = {};
      let totalValidos = 0;
      let brancos = 0;
      let nulos = 0;

      candidatos.forEach(c => {
        contagem[c.numero] = 0;
      });

      votos.forEach(v => {
        if (v.tipo === 'VALIDO') {
          contagem[v.numero] = (contagem[v.numero] || 0) + 1;
          totalValidos++;
        } else if (v.tipo === 'BRANCO') {
          brancos++;
        } else if (v.tipo === 'NULO') {
          nulos++;
        }
      });

      let textoCandidatos = '';
      candidatos.forEach(c => {
        const q = contagem[c.numero] || 0;
        const pct = totalValidos > 0 ? ((q / totalValidos) * 100).toFixed(1) : '0.0';
        textoCandidatos += `
          <div class="item-relatorio">
            <span><b>${c.numero}</b> ${c.nome} (${c.partido})</span>
            <span>${q} votos <b>(${pct}%)</b></span>
          </div>`;
      });

      area.innerHTML = `
        <div class="relatorio-header">
          URNA ELETRÔNICA<br>
          BOLETIM DE URNA (BU)
        </div>
        <div style="margin-bottom:10px; font-size:11px; text-align:center;">${obterDataHora()}</div>
        
        ${textoCandidatos}
        <div class="item-relatorio" style="margin-top:6px;">
          <span>VOTOS EM BRANCO</span>
          <span>${brancos}</span>
        </div>
        <div class="item-relatorio">
          <span>VOTOS NULOS</span>
          <span>${nulos}</span>
        </div>
        <div class="item-relatorio" style="font-weight:bold !important; margin-top:2px;">
          <span>Total de votos: ${votos.length}</span>
        </div>
        <br><br><br>
        <div style="text-align:center;">
          <span class="link-sobre" onclick="abrirModalSobre()">Sobre</span>
        </div>
      `;
    }

    function zerarVotos() {
      if (confirm('Tem certeza que deseja apagar todos os votos e IPs registrados?')) {
        votos = [];
        ipsVotaram = [];
        jaVotou = false;
        localStorage.setItem('urna_v3_votos', JSON.stringify(votos));
        localStorage.setItem('urna_ips_votaram', JSON.stringify(ipsVotaram));
        document.getElementById('areaImpressao').style.display = 'none';
        atualizarTela();
        alert('Votação e registros zerados com sucesso!');
      }
    }

    // Inicialização do IP e da Tela
    capturarIpEVerificar();
  </script>
